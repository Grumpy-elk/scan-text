<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码内容</title>
<style>
  :root { --fs: clamp(2.5rem, 11vw, 6rem); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 24px;
    overflow: hidden;
  }
  .text {
    font-size: var(--fs);
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    color: #111111;
    word-break: break-word;
  }
  .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.4em);
    animation: fadeUp 0.5s ease-out forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  #giveOverlay {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #ffffff;
    pointer-events: none;
    opacity: 0;
  }
  #giveOverlay.show { opacity: 1; }
  #giveOverlay.fade {
    transition: opacity 0.8s ease-out;
    opacity: 0 !important;
  }
  .mini {
    position: absolute;
    font-weight: 700;
    color: #111111;
    line-height: 1.2;
    opacity: 0;
    transform: scale(0.4) rotate(var(--rot, 0deg));
    animation: popIn 0.3s ease-out forwards;
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>
  <div class="text" id="text"></div>
  <div id="giveOverlay"></div>
<script>
  const str = "扫码的是給";
  const text = document.getElementById("text");
  const overlay = document.getElementById("giveOverlay");
  const step = 600; // 每个字间隔毫秒

  function playRound() {
    // 重置舞台
    text.innerHTML = "";
    overlay.innerHTML = "";
    overlay.className = "";

    // 第一阶段：逐字浮现
    [...str].forEach((c, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.style.animationDelay = (i * step) + "ms";
      if (i === str.length - 1) s.id = "give";
      text.appendChild(s);
    });

    // 全部出现后停留 1 秒，进入满屏「給」特效
    setTimeout(() => {
      document.getElementById("give").style.visibility = "hidden";

      const vw = window.innerWidth, vh = window.innerHeight;
      const base = Math.min(vw, vh);
      const count = 40; // 满屏「給」的数量
      for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "mini";
        s.textContent = "給";
        const fs = base * (0.06 + Math.random() * 0.16); // 随机大小
        s.style.fontSize = fs + "px";
        s.style.left = (Math.random() * (vw - fs)) + "px";  // 随机位置
        s.style.top = (Math.random() * (vh - fs)) + "px";
        s.style.setProperty("--rot", (Math.random() * 120 - 60) + "deg"); // 随机旋转
        s.style.animationDelay = (Math.random() * 0.7) + "s"; // 随机先后冒出
        overlay.appendChild(s);
      }
      overlay.classList.add("show");

      // 满屏后停留 1 秒，整体淡出消失
      setTimeout(() => {
        overlay.classList.add("fade");
        // 消失后稍停片刻，开始下一轮循环
        setTimeout(playRound, 900 + 800);
      }, 1000 + 1000);
    }, str.length * step + 1000);
  }

  playRound();
</script>
</body>
</html>
