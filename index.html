<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码内容</title>
<style>
  :root { --fs: clamp(2.5rem, 11vw, 6rem); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 24px;
    overflow: hidden;
  }
  .text {
    font-size: var(--fs);
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    color: #111111;
    word-break: break-word;
  }
  .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.4em);
    animation: fadeUp 0.5s ease-out forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  #giveOverlay {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #ffffff;
    pointer-events: none;
    opacity: 0;
  }
  #giveOverlay.show { opacity: 1; }
  #giveOverlay.fade {
    transition: opacity 0.8s ease-out;
    opacity: 0 !important;
  }
  .mini {
    position: absolute;
    font-weight: 700;
    color: #111111;
    line-height: 1;
    opacity: 0;
    transform: scale(0.4) rotate(var(--rot, 0deg));
    animation: popIn 0.3s ease-out forwards;
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>
  <div class="text" id="text"></div>
  <div id="giveOverlay"></div>
<script>
  const str = "扫码的是給";
  const text = document.getElementById("text");
  const overlay = document.getElementById("giveOverlay");
  const step = 600; // 每个字间隔毫秒

  // 随机散布但不重叠：按“大→中→小→迷你”多轮尝试，碰撞检测通过才落子
  function scatterGive() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const base = Math.min(vw, vh);
    const placed = []; // {x, y, r} 圆心+半径
    const frag = document.createDocumentFragment();
    let count = 0;

    const passes = [
      { min: 0.15, max: 0.24, tries: 250 },   // 大字
      { min: 0.09, max: 0.15, tries: 800 },   // 中字
      { min: 0.05, max: 0.09, tries: 2500 },  // 小字
      { min: 0.03, max: 0.05, tries: 6000 }   // 迷你字填缝
    ];

    for (const p of passes) {
      for (let t = 0; t < p.tries; t++) {
        const fs = base * (p.min + Math.random() * (p.max - p.min));
        const r = fs * 0.66; // 外接圆半径，含旋转余量
        if (vw < 2 * r || vh < 2 * r) continue;
        const x = r + Math.random() * (vw - 2 * r);
        const y = r + Math.random() * (vh - 2 * r);
        let ok = true;
        for (const q of placed) {
          const dx = x - q.x, dy = y - q.y;
          if (dx * dx + dy * dy < (r + q.r + 3) * (r + q.r + 3)) { ok = false; break; }
        }
        if (!ok) continue;
        placed.push({ x, y, r });
        const s = document.createElement("span");
        s.className = "mini";
        s.textContent = "給";
        s.style.fontSize = fs + "px";
        s.style.left = (x - fs / 2) + "px";
        s.style.top = (y - fs / 2) + "px";
        s.style.setProperty("--rot", (Math.random() * 90 - 45) + "deg");
        s.style.animationDelay = (Math.random() * 0.7) + "s";
        frag.appendChild(s);
        count++;
      }
    }
    overlay.appendChild(frag);
    return count;
  }

  function playRound() {
    text.innerHTML = "";
    overlay.innerHTML = "";
    overlay.className = "";

    [...str].forEach((c, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      s.style.animationDelay = (i * step) + "ms";
      if (i === str.length - 1) s.id = "give";
      text.appendChild(s);
    });

    // 全部出现后停留 1 秒，进入满屏「給」特效
    setTimeout(() => {
      document.getElementById("give").style.visibility = "hidden";
      scatterGive();
      overlay.classList.add("show");

      // 满屏后停留 1 秒，整体淡出消失，然后自动循环
      setTimeout(() => {
        overlay.classList.add("fade");
        setTimeout(playRound, 900 + 800);
      }, 1000 + 1000);
    }, str.length * step + 1000);
  }

  // 测试模式：?scatter 直接展示满屏效果，方便检查排版
  if (location.search.includes("scatter")) {
    scatterGive();
    overlay.classList.add("show");
    document.querySelectorAll(".mini").forEach(s => { s.style.animationDelay = "0s"; });
  } else {
    playRound();
  }
</script>
</body>
</html>
